[pytest]
asyncio_mode = auto
addopts = 
    --strict-config
    --verbose
    --tb=short
    --alluredir=results/allure
    --clean-alluredir
    --junitxml=results/junit.xml
    --html=results/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=results/artifacts
markers =
    p0: priority 0 - critical, must always pass
    p1: priority 1 - high
    p2: priority 2 - medium
    p3: priority 3 - low
    positive: happy-path / expected-behavior tests
    negative: invalid input / error-path tests
    boundary: boundary-value and edge-case tests
    llm: tests that depend on an LLM / AI service
    api: API mocking and network tests
    seeding: tests that create and tear down data via the seeding fixtures
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    visual: marks tests for visual regression testing
    performance: marks tests for performance monitoring
    ai_healing: marks tests for AI healing demonstration
    login: marks tests related to login functionality
    security: marks tests for security and attack testing
    error_recovery: marks tests for error recovery scenarios
    slow: marks tests as slow running
    danger: tests that may cause issues with other tests
    only: when you only want to run a specific test or 2
    fail: something that forces a fail
    compatibility: tests to run in multiple browsers for compatibility testing
    trigger_ai_healing: Failing test to trigger AI-powered test healing on failure
    generated: Tests created with the AI automation creation framework will have this marker
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
